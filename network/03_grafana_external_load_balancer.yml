apiVersion: v1
kind: Service
metadata:
  name: prometheus-operator-grafana-external-lb
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
    - name: http-web
      port: 80         # port exposed externally
      targetPort: 3000 # container port Grafana listens on
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: prometheus-operator