# create metallb external endpoint
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operator-grafana-external-lb
  namespace: monitoring
spec:
  ports:
  - name: http-web
    port: 80
    protocol: TCP
    targetPort: 3000
  selector:
    app.kubernetes.io/instance: prometheus-operator
    app.kubernetes.io/name: grafana
  type: LoadBalancer

