# Victoria Logs Configuration for Kubernetes
# basic configuration for Victoria Logs to receive logs from Vector

apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-logs-config
  namespace: observability
data:
  vminsert.yaml: |
    server:
      http:
        listenAddr: ":8480"
      grpc:
        listenAddr: ":8401"
    storageDataPath: /victoria-logs-data
    retentionPeriod: 30d
    memory:
      allowedPercent: 80
    loggerLevel: INFO
    clusterMembersCount: 1
    http:
      maxRequestBodySize: 10485760
      maxConcurrentRequests: 1000

  vmselect.yaml: |
    server:
      http:
        listenAddr: ":8481"
    storageDataPath: /victoria-logs-data
    memory:
      allowedPercent: 80
    loggerLevel: INFO
    search:
      maxQueryLen: 16384
      maxConcurrentRequests: 10
      maxMemoryPerQuery: 1073741824

  vmstorage.yaml: |
    server:
      http:
        listenAddr: ":8400"
    storageDataPath: /victoria-logs-data
    retentionPeriod: 30d
    memory:
      allowedPercent: 80
    loggerLevel: INFO

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-vmstorage
  namespace: observability
  labels:
    app: victoria-logs-vmstorage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs-vmstorage
  template:
    metadata:
      labels:
        app: victoria-logs-vmstorage
    spec:
      containers:
      - name: vmstorage
        image: victoriametrics/vmstorage:latest
        args:
          - "-storageDataPath=/victoria-logs-data"
          - "-retentionPeriod=30d"
          - "-loggerLevel=INFO"
          - "-memory.allowedPercent=80"
        ports:
          - containerPort: 8400
            name: tcp
        volumeMounts:
          - name: data
            mountPath: /victoria-logs-data
          - name: data
            mountPath: /victoria-logs-data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: victoria-logs-config
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-vmstorage
  namespace: observability
spec:
  selector:
    app: victoria-logs-vmstorage
  ports:
  - port: 8400
    targetPort: 8400
    name: tcp
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-vminsert
  namespace: observability
  labels:
    app: victoria-logs-vminsert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs-vminsert
  template:
    metadata:
      labels:
        app: victoria-logs-vminsert
    spec:
      containers:
      - name: vminsert
        image: victoriametrics/vminsert:latest
        args:
          - "-config=/etc/victoriametrics/vminsert.yaml"
          - "-storageNode=victoria-logs-vmstorage.observability.svc.cluster.local:8400"
        ports:
        - containerPort: 8480
          name: http
        - containerPort: 8401
          name: grpc
        volumeMounts:
        - name: config
          mountPath: /etc/victoriametrics
        - name: data
          mountPath: /victoria-logs-data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: victoria-logs-config
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-vminsert
  namespace: observability
spec:
  selector:
    app: victoria-logs-vminsert
  ports:
  - port: 8480
    targetPort: 8480
    name: http
  - port: 8401
    targetPort: 8401
    name: grpc
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-vmselect
  namespace: observability
  labels:
    app: victoria-logs-vmselect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs-vmselect
  template:
    metadata:
      labels:
        app: victoria-logs-vmselect
    spec:
      containers:
      - name: vmselect
        image: victoriametrics/vmselect:latest
        args:
          - "-config=/etc/victoriametrics/vmselect.yaml"
          - "-storageNode=victoria-logs-vmstorage.observability.svc.cluster.local:8400"
        ports:
        - containerPort: 8481
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/victoriametrics
        - name: data
          mountPath: /victoria-logs-data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: victoria-logs-config
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-vmselect
  namespace: observability
spec:
  selector:
    app: victoria-logs-vmselect
  ports:
  - port: 8481
    targetPort: 8481
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
